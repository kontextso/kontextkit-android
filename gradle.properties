# Gradle's project-wide configuration. Read at startup, BEFORE any
# build.gradle.kts is evaluated — so this is the only place to set
# things that affect the Gradle daemon's JVM or the AGP plugin's
# very early init (useAndroidX / enableJetifier).
#
# Sister file: gradle.properties.example documents the publishing
# credentials kit-vs-CI uses (mavenCentralUsername, GPG keys, etc.) —
# those live outside this file so secrets don't get committed.

# ---------------------------------------------------------------------------
# Android namespace
# ---------------------------------------------------------------------------

# Opt into the modern `androidx.*` namespace instead of the legacy
# `android.support.*`. Effectively mandatory now.
android.useAndroidX=true

# Jetifier rewrites old `android.support.*` references in third-party
# libraries to their AndroidX equivalents. We trust all our deps are
# already AndroidX, so disabling skips the scan and speeds up the build.
android.enableJetifier=false

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------

# Modern Kotlin style guide (4-space indent, trailing commas, etc.).
# Affects ktlint formatting if/when it's wired in.
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Gradle daemon JVM
# ---------------------------------------------------------------------------

# 4GB heap (vs sdk-kotlin's 2GB) — KontextKit pulls in the OMID AAR +
# Robolectric for unit tests, both of which push memory pressure.
#
# `-Dfile.encoding=UTF-8` pins source-file encoding so non-ASCII
# round-trips identically across platforms — without this, JVM uses
# the OS default (UTF-8 on Linux/macOS, but historically windows-1252
# on Windows) which silently corrupts builds on Windows CI.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# ---------------------------------------------------------------------------
# Build performance
# ---------------------------------------------------------------------------

# Run independent task graphs concurrently. Smaller win on this
# single-module project than on sdk-kotlin's composite-build setup,
# but harmless and standard.
org.gradle.parallel=true

# Reuse task outputs across builds (and across branches) once the
# cache is warmed. Biggest impact on CI's clean checkouts and on
# local incremental rebuilds.
org.gradle.caching=true
